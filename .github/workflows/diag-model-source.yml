name: diag

on:
  workflow_dispatch:
  push:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - run: curl.exe -sI https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/UVDoc_infer.tar | Select-Object -First 3
      - run: curl.exe -sI https://paddle-inference-lib.bj.bcebos.com/3.3.1/cxx_c/Windows/CPU/x86-64_avx-mkl-vs2019/paddle_inference.zip | Select-Object -First 3
      - run: curl.exe -s "https://huggingface.co/api/models/PaddlePaddle/PaddleOCR" | Select-Object -First 1
      - run: |
          $base='https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0'
          $m='UVDoc_infer'
          curl.exe -fL -o out.tar "$base/$m.tar"
          Write-Output ("download exit " + $LASTEXITCODE)
          if (Test-Path out.tar) { (Get-Item out.tar).Length }
