name: diag

on:
  workflow_dispatch:
  push:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sI https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/UVDoc_infer.tar | head -3
      - run: curl -sI https://paddle-inference-lib.bj.bcebos.com/3.3.1/cxx_c/Windows/CPU/x86-64_avx-mkl-vs2019/paddle_inference.zip | head -3
      - run: curl -sI https://huggingface.co/PaddlePaddle/PaddleOCR/resolve/main/README.md | head -3
      - run: curl -s https://huggingface.co/api/models/PaddlePaddle/PaddleOCR | head -c 500
